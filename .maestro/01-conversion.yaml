url: http://localhost:8081
name: Conversao de Bitcoin para USD
---
- launchApp
- tapOn: Convert
- assertVisible: Convert Crypto
- tapOn:
    id: conversion-amount
- inputText: '1'
- tapOn:
    id: conversion-cryptocurrency
- assertVisible: Cryptocurrency
- tapOn:
    id: conversion-cryptocurrency-option-bitcoin
- tapOn:
    id: conversion-fiat
- assertVisible: Fiat Currency
- tapOn:
    id: conversion-fiat-option-USD
- assertVisible: Converted Amount
- assertVisible:
    text: '.*\$[0-9,]+\.[0-9]{2}.*'
- takeScreenshot: conversion-valid
